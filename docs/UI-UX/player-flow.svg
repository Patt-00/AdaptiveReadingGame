<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1230" viewBox="0 0 1440 1230"><rect x="0" y="0" width="1440" height="1230" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="50" y="60" fill="#73121F" font-family="Times New Roman, Times New Roman, serif" font-size="38" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Adaptive Reading Game · Player flow</tspan></text><text x="50" y="102" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Proposed complete flow. Screen numbers refer to the reference package.</tspan></text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#73121F"/></marker></defs><rect x="50" y="150" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="180" y="192" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="180" dy="0">Welcome / account</tspan></text><text x="180" y="224" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="180" dy="0">01–07</tspan></text><rect x="410" y="150" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="540" y="192" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="540" dy="0">Main menu</tspan></text><text x="540" y="224" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="540" dy="0">08–10</tspan></text><rect x="770" y="150" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="900" y="192" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="900" dy="0">Story &amp; choices</tspan></text><text x="900" y="224" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="900" dy="0">11–16</tspan></text><rect x="1130" y="150" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="1260" y="192" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="1260" dy="0">Reading Check</tspan></text><text x="1260" y="224" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="1260" dy="0">17–22b</tspan></text><path d="M310 200 H400" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 200 H760" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="683" y="162" width="92" height="25" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="688" y="181" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="start"><tspan x="688" dy="0">New game</tspan></text><path d="M1030 200 H1120" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><path d="M 1260 345 L 1390 410 L 1260 475 L 1130 410 Z" fill="#F8F5EF" stroke="#73121F" stroke-width="2"/><text x="1260" y="403" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="1260" dy="0">More questions?</tspan></text><text x="1260" y="430" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="1260" dy="0">First attempt locked</tspan></text><rect x="770" y="360" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="900" y="402" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="900" dy="0">Analyze / validate</tspan></text><text x="900" y="434" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="900" dy="0">23 · Java owns decision</tspan></text><path d="M 540 360 L 670 425 L 540 490 L 410 425 Z" fill="#F8F5EF" stroke="#73121F" stroke-width="2"/><text x="540" y="418" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="540" dy="0">Model available?</tspan></text><text x="540" y="445" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="540" dy="0">Bounded timeout</tspan></text><path d="M1260 250 V335" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><path d="M1390 410 H1415 V200 H1390" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="1375" y="276" width="42" height="25" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="1380" y="295" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="start"><tspan x="1380" dy="0">Yes</tspan></text><path d="M1130 410 H1040" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="1065" y="372" width="32" height="25" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="1070" y="391" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="start"><tspan x="1070" dy="0">No</tspan></text><path d="M770 410 H680" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="50" y="555" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="180" y="597" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="180" dy="0">Fallback results</tspan></text><text x="180" y="629" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="180" dy="0">25 · deterministic policy</tspan></text><rect x="410" y="555" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="540" y="597" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="540" dy="0">Normal results</tspan></text><text x="540" y="629" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="540" dy="0">24 · validated next level</tspan></text><path d="M 900 555 L 1030 620 L 900 685 L 770 620 Z" fill="#F8F5EF" stroke="#73121F" stroke-width="2"/><text x="900" y="613" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="900" dy="0">Next chapter?</tspan></text><text x="900" y="640" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="900" dy="0">40</tspan></text><rect x="1130" y="555" width="260" height="100" fill="#EEEEEE" stroke="#73121F" stroke-width="2" rx="40"/><text x="1260" y="597" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="1260" dy="0">Story complete</tspan></text><text x="1260" y="629" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="1260" dy="0">37</tspan></text><path d="M540 490 V545" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="555" y="509" width="42" height="25" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="560" y="528" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="start"><tspan x="560" dy="0">Yes</tspan></text><path d="M410 425 H180 V545" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="210" y="387" width="132" height="25" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="215" y="406" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="start"><tspan x="215" dy="0">No / timeout</tspan></text><path d="M310 605 H375 V740 H870 V680" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 605 H725 V620 H760" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><path d="M1030 620 H1120" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="1055" y="579" width="32" height="25" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="1060" y="598" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="start"><tspan x="1060" dy="0">No</tspan></text><rect x="770" y="780" width="260" height="100" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="8"/><text x="900" y="822" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="bold" text-anchor="middle"><tspan x="900" dy="0">Continue story</tspan></text><text x="900" y="854" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="middle"><tspan x="900" dy="0">Repeat story / reading loop</tspan></text><path d="M900 685 V770" fill="none" stroke="#73121F" stroke-width="2" marker-end="url(#arrow)"/><rect x="920" y="725" width="42" height="25" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="925" y="744" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="16" font-weight="normal" text-anchor="start"><tspan x="925" dy="0">Yes</tspan></text><rect x="50" y="930" width="1340" height="225" fill="#F8F5EF" stroke="#73121F" stroke-width="2" rx="8"/><text x="80" y="970" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="25" font-weight="bold" text-anchor="start"><tspan x="80" dy="0">In-session menu · 26–35, 38–39</tspan></text><text x="80" y="1010" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="start"><tspan x="80" dy="0">Story / Reading Check → pause → Save / Load / Settings / Main Menu / Quit</tspan><tspan x="80" dy="28">Return → restore the exact caller; cancellation → no state change</tspan><tspan x="80" dy="28">Save occupied slot → confirm overwrite → success or failure; Load empty slot → disabled</tspan><tspan x="80" dy="28">Logout → clear account session → Welcome; Quit → application closes (36)</tspan></text><text x="50" y="1195" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="start"><tspan x="50" dy="0">Narrative choices never determine the score. Model failure must not block continuing.</tspan></text></svg>