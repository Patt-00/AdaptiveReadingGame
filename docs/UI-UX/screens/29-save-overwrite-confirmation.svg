OT 1?</tspan></text><text x="640" y="329" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">This will replace Chapter 1: Beginning.</tspan><tspan x="640" dy="28">Your other save slots will not be changed.</tspan></text><g data-target="28" role="button" tabindex="0" aria-label="OVERWRITE" class="hotspot"><rect x="345" y="421" width="280" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="485" y="456" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="485" dy="0">OVERWRITE</tspan></text></g><g data-target="27" role="button" tabindex="0" aria-label="CANCEL" class="hotspot"><rect x="655" y="421" width="280" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="795" y="456" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="795" dy="0">CANCEL</tspan></text></g></svg>