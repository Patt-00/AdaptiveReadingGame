<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" aria-labelledby="screen-title-17"><title id="screen-title-17">Reading Check · unanswered</title><defs><linearGradient id="burgundy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A82234"/><stop offset="100%" stop-color="#73121F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="40" y="50" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="bold" text-anchor="start"><tspan x="40" dy="0">Chapter 1: Reading Check</tspan></text><g data-target="26" role="button" tabindex="0" aria-label="MENU" class="hotspot"><rect x="1090" y="24" width="150" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="1165" y="59" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="1165" dy="0">MENU</tspan></text></g><text x="110" y="116" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="start"><tspan x="110" dy="0">Question 1 of 5 · Easy</tspan></text><rect x="110" y="140" width="1060" height="145" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="10"/><text x="140" y="175" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="bold" text-anchor="start"><tspan x="140" dy="0">Read the passage:</tspan></text><text x="140" y="213" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="start"><tspan x="140" dy="0">Mara slipped the letter into her apron before the visitor entered.</tspan><tspan x="140" dy="33.599999999999994">She did not want anyone else to see the message.</tspan></text><text x="110" y="338" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="27" font-weight="bold" text-anchor="start"><tspan x="110" dy="0">Why does Mara hide the letter?</tspan></text><g data-target="19" role="button" tabindex="0" aria-label="A. She wants to throw it away." class="hotspot"><rect x="110" y="365" width="1060" height="58" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="9"/><text x="137" y="403" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="normal" text-anchor="start"><tspan x="137" dy="0">○ A. She wants to throw it away.</tspan></text></g><g data-target="18" role="button" tabindex="0" aria-label="B. She wants to keep the message private." class="hotspot"><rect x="110" y="437" width="1060" height="58" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="9"/><text x="137" y="475" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="normal" text-anchor="start"><tspan x="137" dy="0">○ B. She wants to keep the message private.</tspan></text></g><g data-target="19" role="button" tabindex="0" aria-label="C. She has forgotten how to read." class="hotspot"><rect x="110" y="509" width="1060" height="58" fill="#FFFFFF" stroke="#73121F" stroke-width="2" rx="9"/><text x="137" y="547" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="normal" text-anchor="start"><tspan x="137" dy="0">○ C. She has forgotten how to read.</tspan></text></g><text x="110" y="620" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="normal" text-anchor="start"><tspan x="110" dy="0">Choose one answer, then submit.</tspan></text><g opacity="0.4" aria-disabled="true"><rect x="930" y="592" width="240" height="54" fill="url(#burgundy)" stroke="#D4AF37" stroke-width="3" rx="16"/><text x="1050" y="627" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle"><tspan x="1050" dy="0">SUBMIT</tspan></text></g><text x="640" y="690" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">No timed answering. Only your first submitted answer counts toward the score.</tspan></text></svg>