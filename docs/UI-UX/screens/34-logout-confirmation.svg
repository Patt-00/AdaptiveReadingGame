<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" aria-labelledby="screen-title-34"><title id="screen-title-34">Logout confirmation</title><defs><linearGradient id="burgundy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A82234"/><stop offset="100%" stop-color="#73121F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="640" y="100" fill="#000000" font-family="Times New Roman, Times New Roman, serif" font-size="58" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">ADAPTIVE READING GAME</tspan></text><g transform="translate(427 130) scale(.67)" fill="none" stroke="black" stroke-width="2.5"><path d="M 316 88 C 291 22 233 26 206 63 C 164 119 82 92 71 55 C 61 19 102 6 115 29 C 129 53 97 49 105 34 M 316 88 C 275 49 232 61 190 78 C 149 95 122 80 150 54 C 177 31 239 36 259 65 C 284 99 248 104 237 88 M 316 88 C 277 18 219 18 171 44 C 120 70 66 116 21 75 C -18 39 7 -10 37 0 C 69 10 45 35 42 20 M 316 88 C 302 52 228 61 176 30 C 118 -5 138 48 230 64"/><path d="M 316 88 C 291 22 233 26 206 63 C 164 119 82 92 71 55 C 61 19 102 6 115 29 C 129 53 97 49 105 34 M 316 88 C 275 49 232 61 190 78 C 149 95 122 80 150 54 C 177 31 239 36 259 65 C 284 99 248 104 237 88 M 316 88 C 277 18 219 18 171 44 C 120 70 66 116 21 75 C -18 39 7 -10 37 0 C 69 10 45 35 42 20 M 316 88 C 302 52 228 61 176 30 C 118 -5 138 48 230 64" transform="translate(648 0) scale(-1 1)"/></g><text x="1190" y="42" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="normal" text-anchor="end"><tspan x="1190" dy="0">Player1</tspan></text><g aria-label="NEW GAME"><rect x="420" y="226" width="440" height="61" fill="transparent" stroke="none" stroke-width="2" rx="0"/><text x="640" y="270" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">NEW GAME</tspan></text></g><g aria-label="CONTINUE"><rect x="420" y="298" width="440" height="61" fill="transparent" stroke="none" stroke-width="2" rx="0"/><text x="640" y="342" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">CONTINUE</tspan></text></g><g aria-label="SAVE / LOAD"><rect x="420" y="370" width="440" height="61" fill="transparent" stroke="none" stroke-width="2" rx="0"/><text x="640" y="414" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">SAVE / LOAD</tspan></text></g><g aria-label="SETTINGS"><rect x="420" y="442" width="440" height="61" fill="transparent" stroke="none" stroke-width="2" rx="0"/><text x="640" y="486" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">SETTINGS</tspan></text></g><g aria-label="QUIT"><rect x="420" y="514" width="440" height="61" fill="transparent" stroke="none" stroke-width="2" rx="0"/><text x="640" y="558" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">QUIT</tspan></text></g><g aria-label="LOG OUT"><rect x="1070" y="642" width="101.9" height="36" fill="transparent" stroke="none" stroke-width="2" rx="0"/><text x="1080" y="660" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="18" font-weight="normal" text-anchor="start"><tspan x="1080" dy="0">LOG OUT</tspan></text></g><text x="640" y="690" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Continue resumes your most recent checkpoint.</tspan></text><rect x="0" y="0" width="1280" height="720" fill="#000000" opacity="0.45" stroke="none" stroke-width="2" rx="0"/><rect x="290" y="220" width="700" height="295" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="12"/><text x="640" y="278" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">LOG OUT?</tspan></text><text x="640" y="329" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Saved progress remains in your account.</tspan><tspan x="640" dy="28">Any unsaved session changes will be lost.</tspan></text><g data-target="01" role="button" tabindex="0" aria-label="LOG OUT" class="hotspot"><rect x="345" y="421" width="280" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="485" y="456" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="485" dy="0">LOG OUT</tspan></text></g><g data-target="09" role="button" tabindex="0" aria-label="CANCEL" class="hotspot"><rect x="655" y="421" width="280" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="795" y="456" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="795" dy="0">CANCEL</tspan></text></g></svg>