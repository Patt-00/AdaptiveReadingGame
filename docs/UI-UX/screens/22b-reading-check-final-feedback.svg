<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" aria-labelledby="screen-title-22b"><title id="screen-title-22b">Reading Check · final feedback</title><defs><linearGradient id="burgundy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A82234"/><stop offset="100%" stop-color="#73121F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="40" y="50" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="bold" text-anchor="start"><tspan x="40" dy="0">Chapter 1: Reading Check</tspan></text><rect x="200" y="155" width="880" height="415" fill="url(#burgundy)" stroke="#D4AF37" stroke-width="3" rx="16"/><text x="640" y="220" fill="#FFF8DC" font-family="Georgia, Times New Roman, serif" font-size="34" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">CORRECT</tspan></text><text x="640" y="275" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="23" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Your answer: B — keep the message private.</tspan></text><text x="640" y="330" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">The passage says Mara did not want anyone else</tspan><tspan x="640" dy="33.599999999999994">to see the message. That shows she wanted privacy.</tspan></text><text x="640" y="419" fill="#FFF8DC" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Your first answer has been recorded.</tspan></text><g data-target="23" role="button" tabindex="0" aria-label="VIEW RESULTS" class="hotspot"><rect x="480" y="471" width="320" height="54" fill="#D4AF37" stroke="#D4AF37" stroke-width="2" rx="4"/><text x="640" y="506" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">VIEW RESULTS</tspan></text></g><text x="640" y="690" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Feedback teaches the reading skill. Do not let the player resubmit for a higher score.</tspan></text></svg>