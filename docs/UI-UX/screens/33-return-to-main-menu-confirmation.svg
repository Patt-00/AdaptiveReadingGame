<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" aria-labelledby="screen-title-33"><title id="screen-title-33">Return to main menu confirmation</title><defs><linearGradient id="burgundy" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A82234"/><stop offset="100%" stop-color="#73121F"/></linearGradient></defs><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" stroke="none" stroke-width="2" rx="0"/><text x="40" y="50" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="26" font-weight="bold" text-anchor="start"><tspan x="40" dy="0">Chapter 1: Beginning</tspan></text><g aria-label="MENU"><rect x="1090" y="24" width="150" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="1165" y="59" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="1165" dy="0">MENU</tspan></text></g><rect x="240" y="505" width="800" height="147" fill="url(#burgundy)" stroke="#D4AF37" stroke-width="3" rx="14"/><rect x="540" y="481" width="200" height="34" fill="url(#burgundy)" stroke="#D4AF37" stroke-width="2" rx="8"/><text x="640" y="505" fill="#FFF8DC" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">???</tspan></text><text x="270" y="555" fill="#FFFFFF" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="normal" text-anchor="start"><tspan x="270" dy="0">Pleased to meet you.</tspan></text><g aria-label="NEXT"><rect x="900" y="583" width="112" height="54" fill="#D4AF37" stroke="#D4AF37" stroke-width="2" rx="4"/><text x="956" y="618" fill="#73121F" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="bold" text-anchor="middle"><tspan x="956" dy="0">NEXT</tspan></text></g><text x="640" y="690" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="17" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Click NEXT or press Space to continue. Esc opens the game menu.</tspan></text><rect x="0" y="0" width="1280" height="720" fill="#000000" opacity="0.45" stroke="none" stroke-width="2" rx="0"/><rect x="290" y="220" width="700" height="295" fill="#FFFFFF" stroke="#000000" stroke-width="3" rx="12"/><text x="640" y="278" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="28" font-weight="bold" text-anchor="middle"><tspan x="640" dy="0">RETURN TO MAIN MENU?</tspan></text><text x="640" y="329" fill="#555555" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="normal" text-anchor="middle"><tspan x="640" dy="0">Any unsaved progress will be lost.</tspan><tspan x="640" dy="28">Saved checkpoints will remain available.</tspan></text><g data-target="09" role="button" tabindex="0" aria-label="MAIN MENU" class="hotspot"><rect x="345" y="421" width="280" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="485" y="456" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="485" dy="0">MAIN MENU</tspan></text></g><g data-target="26" role="button" tabindex="0" aria-label="CANCEL" class="hotspot"><rect x="655" y="421" width="280" height="54" fill="#FFFFFF" stroke="#000000" stroke-width="2" rx="4"/><text x="795" y="456" fill="#000000" font-family="Georgia, Times New Roman, serif" font-size="24" font-weight="normal" text-anchor="middle"><tspan x="795" dy="0">CANCEL</tspan></text></g></svg>